# .github/workflows/ci.yml
# Lab 04: Actions replacement for the Travis config in the PDF.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GITHUB_TOKEN gets only what we list here. Replaces the PAT from the lab.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Travis: language: node_js / node_js: "stable"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # Travis ran this implicitly. Actions needs it spelled out.
      - run: npm test

  deploy:
    # Travis: deploy.on.branch: main  (PRs run tests but never deploy)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout (job-level permissions replace the top-level ones)
      pages: write # publish to Pages
      id-token: write # Pages verifies the deploy came from this repo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Travis: local_dir: build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - id: deployment
        uses: actions/deploy-pages@v4
